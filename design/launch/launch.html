<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yap Launch Film</title>
<style>
  @font-face { font-family: "Geist"; src: url(fonts/geist.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url(fonts/geist-mono.woff2) format("woff2"); font-weight: 100 900; }
  :root { color-scheme: dark; }
  body { margin: 0; background: #151517; color: #f2f2f4; font: 13px/1.4 "Geist", system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; background: #fff; border-radius: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; min-width: 200px; }
  button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid #3a3a3e; background: #232326; color: inherit; cursor: pointer; }
  button.solid { background: #fff; color: #000; border-color: #fff; }
  #time { font-family: "Geist Mono", monospace; min-width: 6ch; }
  #status { color: #a1a1a6; }
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="16" step="0.01" value="0" aria-label="Time">
  <span id="time">0.00</span>
  <button id="export" class="solid">Export MP4</button>
  <span id="status"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
// Yap launch film: 16 seconds, 1920×1080, in the look of yap.primitive8.cc. Every frame is a pure function of
// time, so the preview and the exported MP4 are identical. Export saves to ./out through serve.py.
(() => {
  const W = 1920, H = 1080, FPS = 30, DUR = 16;
  const INK = "#000", MUTED = "rgba(0,0,0,0.5)", SCENE = "#e8e8ed", RED = "#e6383b", PAPER = "#fff";
  const canvas = document.getElementById("film");
  const ctx = canvas.getContext("2d");

  // ---------- Timing ----------
  function bezier(x1, y1, x2, y2) {
    const f = (a, b, t) => 3 * (1 - t) * (1 - t) * t * a + 3 * (1 - t) * t * t * b + t * t * t;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let lo = 0, hi = 1;
      for (let i = 0; i < 28; i++) { const m = (lo + hi) / 2; (f(x1, x2, m) < x) ? lo = m : hi = m; }
      return f(y1, y2, (lo + hi) / 2);
    };
  }
  const easeOut = bezier(0.23, 1, 0.32, 1);
  const easeInOut = bezier(0.77, 0, 0.175, 1);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const mix = (a, b, e) => a + (b - a) * e;
  /** Opacity of something shown from `a` to `b`, fading in and out. */
  const life = (t, a, b, fin = 0.3, fout = 0.25) => easeOut(prog(t, a, a + fin)) * (1 - easeInOut(prog(t, b - fout, b)));

  // ---------- The mark (Yap's own settings, same construction as the app and Mark Lab) ----------
  const cfg = {
    ease: [0.77, 0, 0.175, 1], holdMs: 220, moveMs: 860,
    stroke: 10, rim: 9, fillet: 5.8, fullness: 0.62, smallBoost: 1.55,
    keys: [
      [[-54, -3], [-50, -86], [46, -66]],
      [[-58, 0], [-109, -61], [-55, -87]],
      [[-58, 0], [-138, -20], [-202, -48]],
      [[24, -28], [60, -140], [-72, -82]],
      [[164, -8], [-38, -150], [-160, 0]],
    ],
    idleDrift: 7, startMs: 1100, pasteMs: 420,
  };
  const markEase = bezier(...cfg.ease);
  const perms = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  function match(a, b) {
    let best = b, bd = Infinity;
    for (const p of perms) {
      const c = p.map((i) => b[i]);
      const d = c.reduce((s, q, i) => s + Math.hypot(q[0] - a[i][0], q[1] - a[i][1]), 0);
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  }
  const frames = (() => {
    const seq = [0, 1, 2, 3, 4, 0], out = [cfg.keys[0]];
    for (let i = 1; i < seq.length; i++) out.push(match(out[i - 1], cfg.keys[seq[i]]));
    return out;
  })();
  const lerpRings = (a, b, e) => a.map((p, i) => [p[0] + (b[i][0] - p[0]) * e, p[1] + (b[i][1] - p[1]) * e]);
  function loopRings(t) {
    const seg = (cfg.holdMs + cfg.moveMs) / 1000, L = seg * (frames.length - 1);
    const u = ((t % L) + L) % L, i = Math.min(frames.length - 2, Math.floor(u / seg)), local = u - i * seg;
    const hold = cfg.holdMs / 1000;
    return lerpRings(frames[i], frames[i + 1], local < hold ? 0 : markEase((local - hold) / (cfg.moveMs / 1000)));
  }
  const drift = (rings, t, amt) => rings.map((p, i) => [p[0] + amt * Math.sin(t * 0.9 + i * 2.1), p[1] + amt * Math.cos(t * 0.7 + i * 1.7)]);
  const idleRings = (t) => drift(cfg.keys[0], t, cfg.idleDrift);
  function startupRings(u) {      // rings slide in from outside the ball while the outline draws on
    const p = clamp(u / (cfg.startMs / 1000)), e = easeOut(p);
    const rings = cfg.keys[0].map(([x, y], i) => {
      const ang = Math.atan2(y || -1, x || 0.001) + i * 0.4;
      return [x + (Math.cos(ang) * 330 - x) * (1 - e), y + (Math.sin(ang) * 330 - y) * (1 - e)];
    });
    return { rings, rim: easeOut(clamp(p * 1.25)) };
  }
  function pastedRings(u, from) {  // one quick roll to the next keyframe
    const to = match(from, cfg.keys[1]);
    return lerpRings(from, to, easeOut(clamp(u / (cfg.pasteMs / 1000))));
  }

  const work = new Map();
  function workFor(px) {
    if (!work.has(px)) {
      const mk = () => { const c = document.createElement("canvas"); c.width = c.height = px; return c; };
      const a = mk(), b = mk(), out = mk();
      work.set(px, { a, b, out, actx: a.getContext("2d"), bctx: b.getContext("2d", { willReadFrequently: true }), octx: out.getContext("2d") });
    }
    return work.get(px);
  }
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  /** Renders the mark at `px` pixels and returns a canvas to draw from (reused, so draw it right away). */
  function mark(px, rings, { ink = INK, rim = 1, alpha = 1 } = {}) {
    px = Math.max(8, Math.round(px));
    const { a, b, out, actx, bctx, octx } = workFor(px);
    const small = px < 80, boost = small ? cfg.smallBoost : 1;
    const s = px / 300, c = px / 2, R = 150 * s;
    actx.setTransform(1, 0, 0, 1, 0, 0);
    actx.fillStyle = "#fff"; actx.fillRect(0, 0, px, px);
    actx.strokeStyle = "#000"; actx.lineWidth = cfg.stroke * boost * s;
    for (const [x, y] of [[0, 0], ...rings]) { actx.beginPath(); actx.arc(c + x * s, c + y * s, 145 * s, 0, Math.PI * 2); actx.stroke(); }
    bctx.clearRect(0, 0, px, px);
    const blur = cfg.fillet * s * (small ? 0.85 : 1);
    if (blur > 0.2) bctx.filter = `blur(${blur.toFixed(2)}px)`;
    bctx.drawImage(a, 0, 0);
    bctx.filter = "none";
    const img = bctx.getImageData(0, 0, px, px), d = img.data;
    const [ir, ig, ib] = hexToRgb(ink), k = small ? 14 : 48, edge = 1 / Math.max(1, s * 2);
    for (let yy = 0, i = 0; yy < px; yy++) {
      for (let xx = 0; xx < px; xx++, i += 4) {
        let al = clamp((cfg.fullness - d[i] / 255) * k + 0.5);
        al *= clamp((R - Math.hypot(xx + 0.5 - c, yy + 0.5 - c)) * edge * 2 + 0.5);
        d[i] = ir; d[i + 1] = ig; d[i + 2] = ib; d[i + 3] = al * 255;
      }
    }
    bctx.putImageData(img, 0, 0);
    octx.clearRect(0, 0, px, px);
    octx.globalAlpha = alpha;
    octx.drawImage(b, 0, 0);
    octx.strokeStyle = ink; octx.lineWidth = cfg.rim * boost * s;
    octx.beginPath();
    octx.arc(c, c, R - cfg.rim * boost * s / 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rim);
    octx.stroke();
    octx.globalAlpha = 1;
    return out;
  }
  function drawMark(cx, cy, size, rings, opt) {
    const m = mark(size * (opt?.res ?? 1), rings, opt);
    ctx.drawImage(m, cx - size / 2, cy - size / 2, size, size);
  }

  // ---------- Drawing helpers ----------
  function font(size, weight = 500, family = "Geist") { return `${weight} ${size}px "${family}"`; }
  function text(s, x, y, { size = 48, weight = 500, color = INK, align = "left", family = "Geist", track = -0.02, baseline = "alphabetic" } = {}) {
    ctx.font = font(size, weight, family);
    ctx.letterSpacing = `${(track * size).toFixed(2)}px`;
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = baseline;
    ctx.fillText(s, x, y);
  }
  function measure(s, size, weight = 500, family = "Geist", track = -0.02) {
    ctx.font = font(size, weight, family);
    ctx.letterSpacing = `${(track * size).toFixed(2)}px`;
    return ctx.measureText(s).width;
  }
  function rr(x, y, w, h, r, fill, stroke, lw = 2) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function withAlpha(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
  function rise(a, px = 26) { return (1 - a) * px; }  // things settle upwards as they fade in

  // A feature scene: label, heading and one line on the left, a grey demo panel on the right, like the site.
  const CARD = { x: 840, y: 140, w: 920, h: 800 };
  function featureText(t, a, b, label, heading, line, chip) {
    const l1 = life(t, a + 0.05, b), l2 = life(t, a + 0.12, b), l3 = life(t, a + 0.22, b);
    withAlpha(l1, () => {
      text(label, 160, 448 + rise(l1), { size: 28, color: MUTED, track: 0 });
      if (chip) {
        const w = measure(label, 28, 500, "Geist", 0);
        rr(160 + w + 16, 420 + rise(l1), 74, 36, 18, INK);
        text(chip, 160 + w + 53, 445 + rise(l1), { size: 20, weight: 600, color: PAPER, align: "center", track: 0 });
      }
    });
    withAlpha(l2, () => text(heading, 156, 540 + rise(l2), { size: 88 }));
    withAlpha(l3, () => text(line, 160, 604 + rise(l3), { size: 32, color: MUTED, track: -0.01 }));
  }
  function card(t, a, b, draw) {
    const l = life(t, a, b, 0.4, 0.25), e = easeOut(prog(t, a, a + 0.55));
    withAlpha(l, () => {
      ctx.save();
      ctx.translate((1 - e) * 70, 0);
      rr(CARD.x, CARD.y, CARD.w, CARD.h, 36, SCENE);
      ctx.beginPath(); ctx.roundRect(CARD.x, CARD.y, CARD.w, CARD.h, 36); ctx.clip();
      draw(t - a);
      ctx.restore();
    });
  }
  function header(t) {  // the site's header: the mark and "by p8"
    const l = life(t, 2.4, 14.05, 0.4, 0.3);
    withAlpha(l, () => {
      drawMark(182, 112, 44, idleRings(t), { res: 2 });
      text("by p8", 218, 121, { size: 24, color: MUTED, track: 0 });
    });
  }

  // ---------- Scenes ----------
  function intro(t) {                       // 0 – 2.4
    const out = 1 - easeInOut(prog(t, 2.05, 2.4));
    withAlpha(out, () => {
      const st = startupRings(t - 0.1);
      const rings = t < 1.25 ? st.rings : idleRings(t - 1.25);
      drawMark(960, 400, 300, rings, { rim: t < 1.25 ? st.rim : 1 });
      const a1 = easeOut(prog(t, 0.95, 1.4)), a2 = easeOut(prog(t, 1.25, 1.7));
      withAlpha(a1, () => text("Less typing.", 960, 708 + rise(a1), { size: 104, align: "center" }));
      withAlpha(a2, () => text("More yapping.", 960, 830 + rise(a2), { size: 104, align: "center" }));
    });
  }

  function dictation(t) {                   // 2.4 – 6.0
    const a = 2.4, b = 6.0;
    featureText(t, a, b, "Voice dictation", "Just say it.", "Talk. Yap types it, cleaned up.");
    card(t, a, b, (u) => {
      // A chat window with the cursor in its message box.
      const wx = CARD.x + 60, wy = CARD.y + 70, ww = 800, wh = 430;
      rr(wx, wy, ww, wh, 22, PAPER);
      text("# launch", wx + 36, wy + 58, { size: 28, weight: 600, track: -0.01 });
      rr(wx + 36, wy + 96, 46, 46, 23, "#d4d4da");
      text("Maya", wx + 100, wy + 112, { size: 22, weight: 600, track: 0 });
      text("When do we ship 1.1?", wx + 100, wy + 142, { size: 26, color: "rgba(0,0,0,0.75)", track: -0.01 });
      const pasted = u >= 2.55;
      if (pasted) {
        const p = easeOut(prog(u, 2.55, 2.9));
        withAlpha(p, () => {
          rr(wx + 36, wy + 182 + rise(p, 12), 46, 46, 23, INK);
          text("You", wx + 100, wy + 198 + rise(p, 12), { size: 22, weight: 600, track: 0 });
          text("Ship it Thursday at 4.", wx + 100, wy + 228 + rise(p, 12), { size: 26, color: "rgba(0,0,0,0.75)", track: -0.01 });
        });
      }
      // Message box: the text lands here, then "send it" sends it.
      const sent = u >= 2.9;
      rr(wx + 30, wy + wh - 104, ww - 60, 72, 16, PAPER, "#d9d9de");
      if (pasted && !sent) {
        text("Ship it Thursday at 4.", wx + 58, wy + wh - 58, { size: 26, track: -0.01 });
      } else if (!pasted || sent) {
        text("Message #launch", wx + 58, wy + wh - 58, { size: 26, color: "rgba(0,0,0,0.35)", track: -0.01 });
      }
      if (Math.floor(u * 2.2) % 2 === 0 && !(pasted && !sent)) rr(wx + 56, wy + wh - 86, 3, 36, 1.5, INK);

      // The Flow bar.
      const cx = CARD.x + CARD.w / 2, cy = CARD.y + 660;
      const listen = prog(u, 0.3, 0.55), think = prog(u, 1.95, 2.2), paste = prog(u, 2.5, 2.75), done = prog(u, 3.15, 3.4);
      const e1 = easeOut(listen), e2 = easeInOut(think), e3 = easeOut(paste), e4 = easeInOut(done);
      let pw = mix(70, 330, e1); pw = mix(pw, 110, e2); pw = mix(pw, 520, e3); pw = mix(pw, 70, e4);
      let ph = mix(12, 72, e1); ph = mix(ph, 72, e3); ph = mix(ph, 12, e4);
      const pillColor = e1 > 0.02 && e4 < 0.98 ? "#0b0b0c" : "rgba(0,0,0,0.35)";
      rr(cx - pw / 2, cy - ph / 2, pw, ph, ph / 2, pillColor);
      if (e1 > 0.5 && paste === 0) {
        const markX = think > 0 ? cx - mix(110, 0, e2) : cx - 110;
        const rings = think > 0 ? loopRings(u * 3.2) : loopRings(0.4 + u * 1.7);
        drawMark(markX, cy, 44, rings, { ink: "#ffffff", res: 2, alpha: clamp((e1 - 0.5) * 2) });
        // Waveform: louder in syllables, quiet between words.
        const bars = 14, voiceOn = 1 - e2;
        for (let i = 0; i < bars; i++) {
          const v = (0.35 + 0.65 * Math.max(0, Math.sin(u * 13 + i * 0.35))) * (Math.sin(u * 2.3 + 0.6) > -0.8 ? 1 : 0.35);
          const shape = 0.35 + 0.65 * Math.sin(Math.PI * (i + 0.5) / bars);
          const h = (10 + 34 * v * (0.45 + 0.55 * Math.abs(Math.sin(u * 9 + i * 1.3))) * shape) * voiceOn;
          if (h < 1) continue;
          rr(cx - 62 + i * 13, cy - h / 2, 6, h, 3, "#ffffff");
        }
      }
      if (paste > 0 && done < 1) {
        withAlpha(e3 * (1 - e4), () => {
          ctx.beginPath(); ctx.arc(cx - 206, cy, 15, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
          ctx.strokeStyle = "#0b0b0c"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
          ctx.beginPath(); ctx.moveTo(cx - 213, cy); ctx.lineTo(cx - 208, cy + 6); ctx.lineTo(cx - 198, cy - 6); ctx.stroke();
          text("Pasted · also on your clipboard", cx - 176, cy + 9, { size: 26, weight: 500, color: "#fff", track: -0.01 });
        });
      }
      // Live words above the Flow bar.
      const raw = "ship it thursday at 3, no wait, 4";
      const shown = raw.slice(0, Math.round(raw.length * prog(u, 0.6, 1.85)));
      const bubble = easeOut(prog(u, 0.6, 0.8)) * (1 - easeInOut(prog(u, 2.1, 2.4)));
      if (shown.length) withAlpha(bubble, () => {
        const tw = Math.max(measure(raw, 26, 500, "Geist", -0.01), 10);
        rr(cx - tw / 2 - 26, cy - 128, tw + 52, 58, 16, "#2a2a2d");
        text(shown, cx - tw / 2, cy - 90, { size: 26, color: "#fff", track: -0.01 });
      });
    });
  }

  function recording(t) {                   // 6.0 – 9.2
    const a = 6.0, b = 9.2;
    featureText(t, a, b, "Screen recording", "Show, don't tell.", "Camera, clicks and smooth zooms.");
    card(t, a, b, (u) => {
      const sx = CARD.x + 60, sy = CARD.y + 60, sw = 800, sh = 680;
      const btn = { x: sx + 560, y: sy + 520, w: 190, h: 64 };
      const focus = [btn.x + btn.w * 0.78, btn.y + btn.h * 0.68];           // where the click lands
      // Auto-zoom: scale up around the click and pan it towards the middle, like Yap does.
      const ze = easeInOut(prog(u, 1.85, 2.6)), z = 1 + 0.45 * ze;
      const to = [mix(focus[0], sx + sw * 0.55, ze * 0.6), mix(focus[1], sy + sh * 0.55, ze * 0.6)];
      ctx.save();
      ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 20); ctx.clip();
      rr(sx, sy, sw, sh, 20, PAPER);
      ctx.translate(to[0], to[1]); ctx.scale(z, z); ctx.translate(-focus[0], -focus[1]);
      // A simple app: window controls, a sidebar and a draft with a Publish button.
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(sx + 36 + i * 26, sy + 34, 8, 0, Math.PI * 2); ctx.fillStyle = "#d4d4da"; ctx.fill(); }
      rr(sx + 24, sy + 72, 190, sh - 96, 14, "#f4f4f6");
      for (let i = 0; i < 5; i++) rr(sx + 46, sy + 104 + i * 52, i === 1 ? 140 : 110, 20, 10, i === 1 ? "#cfcfd6" : "#e3e3e8");
      text("Release notes", sx + 250, sy + 128, { size: 38, weight: 600 });
      for (let i = 0; i < 6; i++) rr(sx + 250, sy + 170 + i * 40, [470, 430, 490, 380, 450, 300][i], 16, 8, "#ebebef");
      rr(sx + 250, sy + 430, 230, 150, 14, "#f0f0f3");
      rr(btn.x, btn.y, btn.w, btn.h, 32, INK);
      text("Publish", btn.x + btn.w / 2, btn.y + 42, { size: 26, weight: 600, color: PAPER, align: "center", track: -0.01 });
      // The pointer travels to Publish and clicks; a ring marks the click.
      const m = easeInOut(prog(u, 1.15, 1.75));
      const px = mix(sx + 380, focus[0], m), py = mix(sy + 300, focus[1], m);
      const click = prog(u, 1.78, 2.3);
      if (click > 0 && click < 1) {
        ctx.beginPath(); ctx.arc(focus[0], focus[1], mix(14, 70, easeOut(click)), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0,0,0,${0.45 * (1 - click)})`; ctx.lineWidth = 6; ctx.stroke();
      }
      if (u > 1.05) {
        ctx.save(); ctx.translate(px, py); ctx.scale(1.25, 1.25);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(8, 23); ctx.lineTo(13, 34); ctx.lineTo(19, 31); ctx.lineTo(14, 21); ctx.lineTo(24, 21); ctx.closePath();
        ctx.fillStyle = INK; ctx.fill(); ctx.strokeStyle = PAPER; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      // Countdown, then the recording chip and camera bubble (not zoomed: they're Yap's, on top).
      for (let n = 0; n < 3; n++) {
        const p = prog(u, 0.15 + n * 0.3, 0.45 + n * 0.3);
        if (p <= 0 || p >= 1) continue;
        withAlpha(Math.sin(Math.PI * p), () => {
          const s = mix(1.15, 0.95, easeOut(p));
          ctx.save(); ctx.translate(sx + sw / 2, sy + sh / 2); ctx.scale(s, s);
          ctx.beginPath(); ctx.arc(0, 0, 110, 0, Math.PI * 2); ctx.fillStyle = "rgba(0,0,0,0.78)"; ctx.fill();
          text(String(3 - n), 0, 50, { size: 150, weight: 600, color: PAPER, align: "center", track: 0 });
          ctx.restore();
        });
      }
      const rec = easeOut(prog(u, 1.05, 1.35));
      withAlpha(rec, () => {
        rr(sx + sw - 196, sy + 22, 172, 54, 27, "rgba(0,0,0,0.82)");
        const pulse = 0.8 + 0.2 * Math.cos((u - 1.05) * 5);
        ctx.beginPath(); ctx.arc(sx + sw - 166, sy + 49, 10, 0, Math.PI * 2); ctx.fillStyle = RED; ctx.globalAlpha *= pulse; ctx.fill(); ctx.globalAlpha /= pulse;
        const secs = Math.max(0, Math.floor((u - 1.05) * 1.6));
        text(`0:${String(secs).padStart(2, "0")}`, sx + sw - 140, sy + 60, { size: 28, weight: 500, family: "Geist Mono", color: PAPER, track: 0 });
        const cs = mix(0.6, 1, easeOut(prog(u, 1.05, 1.5)));
        ctx.save(); ctx.translate(sx + 130, sy + sh - 130); ctx.scale(cs, cs);
        ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
        ctx.beginPath(); ctx.arc(0, 0, 96, 0, Math.PI * 2); ctx.fillStyle = PAPER; ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.beginPath(); ctx.arc(0, 0, 89, 0, Math.PI * 2); ctx.save(); ctx.clip();
        const g = ctx.createLinearGradient(0, -90, 0, 90); g.addColorStop(0, "#dcdfe6"); g.addColorStop(1, "#b9bec9"); ctx.fillStyle = g; ctx.fillRect(-90, -90, 180, 180);
        ctx.fillStyle = "#6f7480";
        ctx.beginPath(); ctx.arc(0, -16, 34, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 78, 70, 56, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore(); ctx.restore();
      });
    });
  }

  function meeting(t) {                     // 9.2 – 12.4
    const a = 9.2, b = 12.4;
    featureText(t, a, b, "Meeting notes", "Every call, noted.", "Who said what, and what's next.", "New");
    card(t, a, b, (u) => {
      const wx = CARD.x + 60, wy = CARD.y + 60, ww = 800, wh = 680;
      rr(wx, wy, ww, wh, 22, PAPER);
      text("Launch sync", wx + 40, wy + 72, { size: 38, weight: 600 });
      text("Today · Zoom · 3 people", wx + 40, wy + 112, { size: 24, color: MUTED, track: 0 });
      // The meeting pill while it listens.
      const live = 1 - easeInOut(prog(u, 1.55, 1.8));
      withAlpha(live, () => {
        rr(wx + ww - 300, wy + 40, 260, 56, 28, "#0b0b0c");
        const secs = 40 + Math.floor(u * 2);
        text(`Notes · 0:${secs}`, wx + ww - 274, wy + 77, { size: 24, weight: 600, color: PAPER, track: 0 });
        rr(wx + ww - 116, wy + 49, 64, 38, 19, RED);
        text("End", wx + ww - 84, wy + 75, { size: 20, weight: 700, color: PAPER, align: "center", track: 0 });
      });
      const lines = [
        ["Others", "Can we ship 1.1 on Thursday?"],
        ["You", "Yes. I'll send the release notes tomorrow."],
        ["Others", "Great, and Ada will update the site."],
      ];
      lines.forEach(([who, said], i) => {
        const p = easeOut(prog(u, 0.3 + i * 0.32, 0.6 + i * 0.32));
        withAlpha(p, () => {
          const y = wy + 190 + i * 64 + rise(p, 14);
          text(who, wx + 40, y, { size: 24, weight: 600, color: who === "You" ? INK : "rgba(0,0,0,0.45)", track: 0 });
          text(said, wx + 150, y, { size: 26, color: "rgba(0,0,0,0.8)", track: -0.01 });
        });
      });
      // The notes write themselves: action items appear, then get ticked off.
      const n = easeOut(prog(u, 1.7, 2.0));
      withAlpha(n, () => {
        rr(wx + 40, wy + 400 + rise(n, 10), ww - 80, 2, 1, "#ececf0");
        text("Action items", wx + 40, wy + 456 + rise(n, 10), { size: 28, weight: 600, track: -0.01 });
      });
      [["Send the release notes", "You · tomorrow"], ["Update the website", "Ada"]].forEach(([task, who], i) => {
        const p = easeOut(prog(u, 1.9 + i * 0.22, 2.2 + i * 0.22));
        withAlpha(p, () => {
          const y = wy + 510 + i * 64 + rise(p, 12);
          const done = easeOut(prog(u, 2.55 + i * 0.25, 2.75 + i * 0.25));
          rr(wx + 40, y, 32, 32, 9, done > 0 ? `rgba(0,0,0,${done})` : null, "rgba(0,0,0,0.35)", 2.5);
          if (done > 0) {
            ctx.strokeStyle = PAPER; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.beginPath(); ctx.moveTo(wx + 48, y + 17); ctx.lineTo(wx + 54, y + 23); ctx.lineTo(wx + 65, y + 10); ctx.stroke();
          }
          text(task, wx + 92, y + 26, { size: 26, color: done > 0.5 ? "rgba(0,0,0,0.45)" : INK, track: -0.01 });
          const tw = measure(task, 26, 500, "Geist", -0.01);
          text(who, wx + 92 + tw + 16, y + 26, { size: 22, color: MUTED, track: 0 });
        });
      });
    });
  }

  function privacy(t) {                     // 12.4 – 14.0
    const a = 12.4, b = 14.0;
    const l0 = life(t, a + 0.05, b, 0.3, 0.25);
    withAlpha(l0, () => text("Privacy", 960, 330 + rise(l0), { size: 28, color: MUTED, align: "center", track: 0 }));
    ["No account.", "No cloud.", "All on your Mac."].forEach((s, i) => {
      const l = life(t, a + 0.12 + i * 0.2, b, 0.35, 0.25);
      withAlpha(l, () => text(s, 960, 470 + i * 140 + rise(l), { size: 112, align: "center", color: i === 2 ? INK : "rgba(0,0,0,0.32)" }));
    });
  }

  function endCard(t) {                     // 14.0 – 16.0
    const u = t - 14.0;
    const m = easeOut(prog(u, 0, 0.5));
    withAlpha(m, () => {
      const rings = u < 0.45 ? pastedRings(Math.max(0, u - 0.05), cfg.keys[0]) : drift(match(cfg.keys[0], cfg.keys[1]), u - 0.45, cfg.idleDrift);
      drawMark(960, 360 + rise(m, 20), 240, rings);
    });
    const h = easeOut(prog(u, 0.2, 0.6));
    withAlpha(h, () => text("Got something to say?", 960, 640 + rise(h), { size: 96, align: "center" }));
    const p = easeOut(prog(u, 0.4, 0.8));
    withAlpha(p, () => {
      const label = "Download for Mac ↗", w = measure(label, 34, 500, "Geist", -0.01) + 80;
      rr(960 - w / 2, 708 + rise(p, 14), w, 80, 40, INK);
      text(label, 960, 760 + rise(p, 14), { size: 34, color: PAPER, align: "center", track: -0.01 });
    });
    const s = easeOut(prog(u, 0.55, 0.95));
    withAlpha(s, () => {
      text("Free and open source · yap.primitive8.cc", 960, 870 + rise(s, 12), { size: 30, color: MUTED, align: "center", track: -0.005 });
      text("by p8", 960, 1010, { size: 24, color: MUTED, align: "center", track: 0 });
    });
  }

  function draw(t) {
    t = clamp(t, 0, DUR);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    if (t < 2.45) intro(t);
    if (t >= 2.4 && t < 14.05) header(t);
    if (t >= 2.4 && t < 6.05) dictation(t);
    if (t >= 6.0 && t < 9.25) recording(t);
    if (t >= 9.2 && t < 12.45) meeting(t);
    if (t >= 12.4 && t < 14.05) privacy(t);
    if (t >= 14.0) endCard(t);
  }

  // ---------- Preview ----------
  const $ = (id) => document.getElementById(id);
  let playing = true, t0 = performance.now(), cur = Number(new URLSearchParams(location.search).get("t")) || 0;
  let exporting = false;
  function tick(now) {
    if (playing && !exporting) { cur = ((now - t0) / 1000) % DUR; }
    if (!exporting) { draw(cur); $("scrub").value = cur; $("time").textContent = cur.toFixed(2); }
    requestAnimationFrame(tick);
  }
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; t0 = performance.now() - cur * 1000; };
  $("scrub").oninput = (e) => { playing = false; $("play").textContent = "Play"; cur = Number(e.target.value); };
  window.renderAt = (t) => { playing = false; cur = t; draw(t); };

  // ---------- Export ----------
  async function save(name, blob) {
    const r = await fetch(`out/${name}`, { method: "PUT", body: blob });
    if (!r.ok) throw new Error(`Saving ${name} failed (${r.status}). Is serve.py running?`);
    return name;
  }
  async function exportFilm() {
    if (exporting) return;
    exporting = true;
    const status = (s) => { $("status").textContent = s; };
    try {
      let config = null;
      for (const codec of ["avc1.640033", "avc1.640032", "avc1.640028", "avc1.4d0034"]) {
        const c = { codec, width: W, height: H, bitrate: 16_000_000, framerate: FPS, avc: { format: "avc" } };
        try { if ((await VideoEncoder.isConfigSupported(c)).supported) { config = c; break; } } catch (_) {}
      }
      if (!config) throw new Error("This browser can't encode H.264");
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, fastStart: "in-memory" });
      let failure = null;
      const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => { failure = e; } });
      enc.configure(config);
      const total = DUR * FPS;
      for (let i = 0; i < total; i++) {
        if (failure) throw failure;
        draw(i / FPS);
        const frame = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
        enc.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
        frame.close();
        if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 0));
        if (i % 15 === 0) { status(`Rendering ${Math.round(i / total * 100)}%`); await new Promise((r) => setTimeout(r, 0)); }
      }
      await enc.flush(); enc.close(); muxer.finalize();
      const mp4 = new Blob([muxer.target.buffer], { type: "video/mp4" });
      await save("yap-launch.mp4", mp4);
      draw(15.4);
      const png = await new Promise((r) => canvas.toBlob(r, "image/png"));
      await save("yap-launch-poster.png", png);
      status(`Saved out/yap-launch.mp4 (${(mp4.size / 1e6).toFixed(1)} MB) and the poster`);
      window.exportResult = { ok: true, bytes: mp4.size };
    } catch (e) {
      status(e.message || String(e));
      window.exportResult = { ok: false, error: e.message || String(e) };
    } finally {
      exporting = false;
    }
  }
  $("export").onclick = exportFilm;
  window.exportFilm = exportFilm;

  Promise.all([document.fonts.load(font(88, 500)), document.fonts.load(font(40, 600)), document.fonts.load(font(28, 500, "Geist Mono"))])
    .then(() => { t0 = performance.now() - cur * 1000; requestAnimationFrame(tick); });
})();
</script>
